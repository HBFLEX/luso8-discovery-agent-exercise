services:
  db:
    image: postgres:16-alpine
    container_name: luso8-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: luso8
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luso8"]
      interval: 3s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: luso8-server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/luso8
      GROQ_API_KEY: ${GROQ_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3-32b}
      APP_ENV: development
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/data:/app/data
    restart: unless-stopped

volumes:
  db_data: