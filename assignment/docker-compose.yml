services:
  db:
    image: postgres:16-alpine
    container_name: luso8-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: luso8
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luso8"]
      interval: 3s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: luso8-server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/luso8
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      APP_ENV: development
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: luso8-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - server
    restart: unless-stopped

  backend-test:
    build: ./server
    container_name: luso8-backend-test
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/luso8
      APP_ENV: testing
    volumes:
      - ./server:/app
    depends_on:
      db:
        condition: service_healthy
    command: uv run pytest tests/ -v

  frontend-test:
    build:
      context: ./frontend
      target: base
    container_name: luso8-frontend-test
    profiles: ["test"]
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npx vitest run"

volumes:
  db_data: