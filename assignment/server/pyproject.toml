[project]
name = "luso8-lead-discovery"
version = "0.1.0"
description = "Lead Discovery Agent — vertical slice for Luso8 Cloud"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-groq>=0.1",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
